apiVersion: apps/v1
kind: Deployment

metadata:
  name: cart-service-green

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cart-service
      version: green

  template:
    metadata:
      labels:
        app: cart-service
        version: green

    spec:
      containers:
        - name: cart-service
          image: chaitanyakommi/cart:fc80e4ec858769e174708f2233c13639e0c61cc9
          ports:
            - containerPort: 5001