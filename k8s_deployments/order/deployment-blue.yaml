apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-service-blue

spec:
  replicas: 2

  selector:
    matchLabels:
      app: order-service
      version: blue

  template:
    metadata:
      labels:
        app: order-service
        version: blue

    spec:
      containers:
        - name: order-service
          image: chaitanyakommi/order:4b58543772dd42a5af16b2284e80fbe221ace10a
          ports:
            - containerPort: 5003