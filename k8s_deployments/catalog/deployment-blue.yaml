apiVersion: apps/v1
kind: Deployment

metadata:
  name: catalog-service-blue

spec:
  replicas: 2

  selector:
    matchLabels:
      app: catalog-service
      version: blue

  template:
    metadata:
      labels:
        app: catalog-service
        version: blue

    spec:
      containers:
        - name: catalog-service
          image: chaitanyakommi/catalog:4b58543772dd42a5af16b2284e80fbe221ace10a
          ports:
            - containerPort: 5050